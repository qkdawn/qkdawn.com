<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="qkdawn 的个人主页。">
  <title>qkdawn</title>
  <style>/* The school window is part of one continuous painted surface. */
:root {
  color-scheme: dark;
  --ground: #203436;
  --ink: #f1ebdc;
  --muted: #c0cbc3;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 26px; }
body { margin: 0; background: var(--ground); color: var(--ink); font-size: 15px; line-height: 1.95; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 5px; }
a:focus-visible { outline: 2px solid #edce9f; outline-offset: 5px; }
.skip { position: absolute; top: -80px; left: 20px; padding: 8px 14px; background: var(--ground); z-index: 5; }
.skip:focus { top: 15px; }
.hero { position: relative; display: grid; align-items: center; min-height: clamp(545px, 47vw, 900px); isolation: isolate; overflow: hidden; }
.hero-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 23% 50%; z-index: -2; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(0deg,var(--ground) 1%,transparent 11%); }
.identity { width: min(82%, 1260px); margin-inline: auto; padding-bottom: clamp(45px, 9vw, 130px); }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(61px, 7.2vw, 104px); line-height: 1.04; font-weight: 400; letter-spacing: -.065em; margin: 0 0 17px; }
nav { display: flex; gap: 28px; align-items: center; white-space: nowrap; font-size: 13px; }
nav a { display: inline-flex; align-items: center; min-height: 44px; }
.work { width: min(calc(100% - 48px), 680px); margin: 0 auto; padding: 52px 0 36px; }
h2 { font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: .1em; margin: 0 0 34px; }
article { padding: 0 0 28px; margin-bottom: 32px; border-bottom: 1px solid #9fb6aa38; }
h3 { font-size: 18px; font-weight: 500; margin: 0 0 18px; }
h3 span { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: 17px; }
p { margin: 0 0 13px; }
.secondary { color: var(--muted); font-size: 14px; }
footer { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; padding-top: 27px; }
footer a { padding: 6px 0 6px 10px; }
@media (orientation: portrait) {
  .hero { min-height: clamp(470px, 64svh, 550px); align-items: start; }
  .identity { padding: 73px 0 0; }
  h1 { font-size: clamp(54px, 12vw, 75px); margin-bottom: 8px; }
  nav { gap: 22px; }
  .hero-art { top: 120px; bottom: 0; height: calc(100% - 120px); object-position: 57% 50%;
    mask-image: linear-gradient(transparent,#000 27%); }
  .hero::before { background: linear-gradient(0deg,var(--ground) 1%,transparent 21%); }
  .work { padding-top: 23px; }
}
/* The full lockup shares the calibrated wall plane on desktop. */
@media screen and (orientation: landscape) {
  .wall-print { color: #eee3cc; }
  .has-wall-plane .wall-print {
    position: absolute;
    top: 0; left: 0;
    width: 425px; height: 190px;
    transform-origin: 0 0;
    transform: var(--wall-transform);
  }
  .has-wall-plane .wall-print h1 {
    font-size: 127px;
    line-height: 1;
    margin: 0 0 12px;
    opacity: .93;
  }
  .has-wall-plane .wall-print nav {
    font-size: 20px;
    gap: 34px;
  }
  .has-wall-plane .wall-print nav a { min-height: 50px; }
}
@media print { .skip { display: none; } }

:root {--ground:#182b36}
.hero {min-height:0;display:block;aspect-ratio:1908/824}
.hero-art {top:0;height:100%;object-position:50% center;mask-image:none}
.hero::before {background:linear-gradient(180deg, #14273835 0%, transparent 33%, transparent 88%, #182b36 100%);}
.identity {position:absolute;inset:12% auto auto 9%;width:auto;margin:0;padding:0}
.wall-print {color:#fff1d9;text-shadow:0 1px 2px #152937,0 3px 12px #15293782}
h1 {font-size:clamp(39px,5.25vw,85px);margin:0}
nav {gap:18px}
nav a {font-size:13px;min-height:38px}
@media(orientation: portrait) {
 .hero {aspect-ratio:auto;height:clamp(480px,73svh,680px)}
 .hero-art {object-position:60% 50%}
 .hero::before {background:linear-gradient(180deg,#182b36e8 0%,#182b3638 31%,transparent 43%,transparent 84%,#182b36 100%)}
 .identity {inset:5% auto auto 7%}
 h1 {font-size:clamp(42px,10vw,62px)}
}

/* One viewport; keep the complete artwork on large screens. */
html,body {margin:0}
.hero {height:100vh;height:100svh;aspect-ratio:auto}
.hero-art {object-fit:contain}
.hero::before {background:none}
.identity {inset:max(7%, calc((100% - 43.19vw) / 2 + 4vw)) auto auto 9%}
@media(orientation: portrait) {
  .hero-art {object-fit:cover;object-position:60% 50%}
  .hero::before {background:linear-gradient(180deg,#182b36df 0%,#182b3630 24%,transparent 39%)}
  .identity {inset:max(5%, env(safe-area-inset-top)) auto auto 7%}
}

.room-views{display:none}
@media(orientation: portrait){
.hero{touch-action:pan-y pinch-zoom}
.hero-art{object-position:19.5% 50%;transition:object-position .52s ease-in-out}
.hero[data-view="window"] .hero-art{object-position:67% 50%}
.room-views{display:flex;position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:1;padding:3px;gap:2px;border:1px solid #f1dec660;border-radius:24px;background:#142732ea}
.room-views button{font:inherit;font-size:13px;min-height:44px;border:0;border-radius:20px;padding:0 16px;white-space:nowrap;color:#f2e8dc;background:transparent;cursor:pointer}
.room-views button[aria-pressed="true"]{background:#f4e3cb;color:#172936}
.room-views button:focus-visible{outline:2px solid #e9bf7c;outline-offset:3px}
}
@media(prefers-reduced-motion:reduce){.hero-art{transition:none}}

.room-art {position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.wall-ink {fill:#152e3c;stroke:#fcdeb0;stroke-width:.7px;stroke-opacity:.23;paint-order:stroke;mix-blend-mode:multiply}
.imprint-name {font:700 55px Georgia,"Times New Roman",serif;letter-spacing:.055em}
.wall-link {font:600 19px Georgia,"Times New Roman",serif;outline:none}
.wall-link:focus-visible rect {stroke:#172e42;stroke-width:2px;stroke-opacity:1}
.wall-link:hover text,.wall-link:focus-visible text {text-decoration:underline}
@media(orientation: portrait) {
  .room-art {--canvas:max(100vw,231.5534vh);--canvas:max(100vw,231.5534svh);left:calc((100vw - var(--canvas)) * .195);width:var(--canvas);transition:left .52s ease-in-out}
  .hero[data-view="window"] .room-art {left:calc((100vw - var(--canvas)) * .67)}
}
@media(prefers-reduced-motion:reduce){.room-art{transition:none}}

.print-layer { pointer-events:none; mix-blend-mode:multiply; }
.wall-ink3d {position:absolute;inset:0 auto auto 0;width:424px;height:80px;transform-origin:0 0; color:#152e3c; pointer-events:none;text-shadow:0 .6px #e7d8af65; }
.wall-ink3d h1 {font:700 54px/1.04 Georgia,"Times New Roman",serif;letter-spacing:.02em;margin:0}
.wall-ink3d nav {margin:0;gap:16px}
.wall-ink3d a.wall-link {pointer-events:auto;min-height:32px;font:600 22px Georgia,"Times New Roman",serif;padding-inline:2px 8px}
.wall-ink3d a.wall-link:focus-visible {outline:2px solid #183447;outline-offset:2px}

.print-layer {mix-blend-mode:normal}
.wall-ink3d {transform:var(--wall-wide);color:#fffdf9;text-shadow:0 1px 2px #17344066}
.wall-ink3d h1 {font-size:70px;line-height:1.01}
.wall-ink3d a.wall-link {font-size:24px}
.wall-ink3d a.wall-link:focus-visible {outline-color:#fffdf9}
@media(orientation: landscape) {
 .wall-ink3d {width:600px}
 .wall-ink3d h1 {font-size:112px}
 .wall-ink3d a.wall-link {font-size:27px}
}
@media(orientation: portrait) {
 .wall-ink3d {transform:var(--wall-phone)}
 .wall-ink3d h1 {font-size:66px}
}
</style>
</head>

<script>
const room=document.querySelector('.hero');
const buttons=[...room.querySelectorAll('[data-target]')];
const portrait=matchMedia('(orientation: portrait)');
const wallLinks = room.querySelectorAll('.wall-link');
function updateTabStops(){
  const outOfView = portrait.matches && room.dataset.view === 'window';
  for (const link of wallLinks) {
    if(outOfView) link.setAttribute('tabindex','-1');
    else link.removeAttribute('tabindex');
  }
}
portrait.addEventListener?.('change', () => { start=null; updateTabStops(); });
updateTabStops();
function show(view){
  room.dataset.view=view;
  updateTabStops();
  for(const b of buttons) b.setAttribute('aria-pressed',String(view===b.dataset.target));
}
for(const b of buttons) b.addEventListener('click',()=>show(b.dataset.target));
let start=null;
room.addEventListener('pointerdown',e=>{
  if(!portrait.matches||!e.isPrimary||(e.target.closest?.('a,button')))return;
  start=[e.pointerId,e.clientX,e.clientY];
  room.setPointerCapture?.(e.pointerId);
});
room.addEventListener('pointercancel',()=>{start=null});
room.addEventListener('pointerup',e=>{
  if(!portrait.matches){start=null;return;}
  if(!start||start[0]!==e.pointerId)return;
  const dx=e.clientX-start[1],dy=e.clientY-start[2];
  start=null;
  if(Math.abs(dx)>36&&Math.abs(dx)>Math.abs(dy)*1.25)show(dx<0?'window':'piano');
});

</script>
